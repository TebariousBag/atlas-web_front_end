<!DOCTYPE html>
<html lang="en" dir="ltr">

    <head>

        <meta charset="utf-8" />
        <title>Task 0</title>
		<!-- load jquery, preferably a reliable source like official -->
		 <!-- slim cant GET or POST -->
		<script src="https://code.jquery.com/jquery-3.6.4.slim.min.js"></script>
    </head>

    <body>
      <script type="application/javascript">
        // creating empty table, head still has firstname lastname
       function createFamilyTree() {
        const table = $("<table></table>").append(
          $("<thead></thead>").append(
            $("<tr></tr>").append(
              $("<th></th>").text("Firstname"),
                $("<th></th>").text("Lastname"))),
            $("<tbody></tbody>")
          )
          // add the created table to the body of html
          $("body").append(table);
	   }
     // add members to the table
     function addNewMember(firstName, lastName) {
      // structure, row takes a firstname and a lastname
        const row = $("<tr>").append(
            $("<td>").text(firstName),
            $("<td>").text(lastName),
            // an (x) with a click event that removes it from parent
            $("<td>").text("(x)").css("background-color", "orange").click(function () {
                $(this).parent().remove();
            })
        );
        // add the row with the names to the table body
        $("tbody").append(row);
    }
    // create the table
    createFamilyTree();
    // add members
    addNewMember("Guillaume", "Salva");
    addNewMember("Arielle", "Snizt");
    addNewMember("Fanette", "Snizt");
    addNewMember("Gerard", "Snizt");
    addNewMember("Victor", "Salva");

      </script>
    <!-- button to add one member, so i can see remove and add -->
    <input type="button" onclick="addNewMember('Guillaume', 'Salva');" value="add">
    </body>

</html>
