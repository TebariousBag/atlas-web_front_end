<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="utf-8" />
    <title>Task 0</title>
    <!-- load jquery, preferably a reliable source like official -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <!-- style for loading -->
    <style>
      .loading {
        opacity: 0.2;
      }
    </style>

</head>

<body>

  <script>
      // append a post to the body
    function addPostRow(data) {
            // variables for paragraph and span text
            const paragraph = $('<p></p>');
            const span = $('<span></span>').text(`Post created with id ${data.id}, title: ${data.title}, author: ${data.author}`);
            // add the span to the paragraph
            // and append the paragraph to the body
            paragraph.append(span);
            $('body').append(paragraph);
        }

        // get posts from local host url
        function listPosts() {
            $.get('http://localhost:3000/posts')
                .done(function (response) {
                    response.forEach(addPostRow);
                })
                .fail(function () {
                    alert('Server Error');
                });
        }

        // call function when the page loads
        $(document).ready(function () {
            listPosts();
        });

  </script>

</body>

</html>
