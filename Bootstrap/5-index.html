<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Holberton - Web Stack - Bootstrap</title>
        <meta name="description" content="Bootstrap is a free and open-source CSS framework">

        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    </head>
    <body class="m-0 p-0 container-fluid">
		<!-- don't display until 768px or smaller -->
        <h1 class="d-md-none">Small title</h1>
		<!-- display none as default, then md >= 992px it is visible as a block -->
        <h1 class="d-md-block d-none">Big title</h1>
		<!-- had trouble here making sure it was full width at 768 and less -->
        <div class="row col-12 col-md-11 col-xl-11 justify-content-between bg-info p-2 text-white border border-info rounded mx-auto">
            <div class="text-center border border-top-0 border-left-0 p-2 align-self-start">Left</div>
            <div class="text-center border border-top-0 p-2 shadow d-none d-md-block">Middle</div>
            <div class="text-center border border-top-0 border-right-0 p-2 align-self-end">Right</div>
        </div>

    </body>
</html>
