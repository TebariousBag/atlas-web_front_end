<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
        <title>Holberton - Web Stack - Bootstrap</title>
        <meta name="description" content="Bootstrap is a free and open-source CSS framework">

        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    </head>
    <body>
		<!-- This div is a row of columns, spaced evenly if there is no specified value -->
		 <!-- col-lg is Screen >= 992px: display like 4 columns in one line-->
		  <!-- padding is broken down into quarters, so p-2 is .5 rem -->
		   <!-- adding padding to each cell rather than the container div-->
        <div class="row">
            <div class="p-2 col-lg-3 bg-primary text-white text-center ">Primary</div>
            <div class="p-2 col-lg-3 bg-success text-white text-center">Success</div>
            <div class="p-2 col-lg-3 bg-danger text-white text-center">Danger</div>
            <div class="p-2 col-lg-3 bg-warning text-white text-center">Warning</div>
        </div>

        <hr />

        <div class="row">
            <div class="p-2 col-sm-3 bg-primary text-white text-center">Primary</div>
            <div class="p-2 col-sm-3 bg-success text-white text-center">Success</div>
            <div class="p-2 col-sm-3 bg-danger text-white text-center">Danger</div>
            <div class="p-2 col-sm-3 bg-warning text-white text-center">Warning</div>
        </div>

        <hr />
		<!-- just breaking down the sizes, tell it how many units and then break down sections -->
        <div class="row">
            <div class="p-2 col-12 col-lg-2 bg-primary text-white text-center">Primary</div>
            <div class="p-2 col-12 col-lg-4 bg-success text-white text-center">Success</div>
            <div class="p-2 col-12 col-lg-6 bg-danger text-white text-center">Danger</div>
        </div>

        <hr />
		<!-- setting up he order based on screen sizw-->
        <div class="row">
			<div class="p-2 order-xl-1 order-lg-2 order-md-3 order-sm-4 bg-primary text-white text-center col-12 col-xl-3 col-lg-3 col-md-3 col-sm-3">Primary</div>
            <div class="p-2 order-xl-2 order-lg-3 order-md-4 order-sm-1 bg-success text-white text-center col-12 col-xl-3 col-lg-3 col-md-3 col-sm-3">Success</div>
            <div class="p-2 order-xl-3 order-lg-4 order-md-1 order-sm-2 bg-danger text-white text-center col-12 col-xl-3 col-lg-3 col-md-3 col-sm-3">Danger</div>
            <div class="p-2 order-xl-4 order-lg-1 order-md-2 order-sm-3 bg-warning text-white text-center col-12 col-xl-3 col-lg-3 col-md-3 col-sm-3">Warning</div>
        </div>

        <hr/>

        <div class="row justify-content-between">
            <div class="p-2 col-12 col-md-2 col-md-2 text-white text-center bg-primary">Primary</div>
            <div class="p-2 col-12 col-md-2 col-md-2 text-white text-center bg-success">Success</div>
        </div>

        <hr/>

        <div class="row justify-content-between">
            <div class="text-white text-center bg-primary col-12 col-md-2 p-2">Primary</div>
            <div class="text-white text-center bg-success col-12 col-md-2 offset-md-3">Success</div>
            <div class="text-white text-center bg-danger col-12 col-md-2 p-2 offset-md-1">Danger</div>
        </div>
    </body>
</html>
