<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
        <title>Holberton - Web Stack - Bootstrap</title>
        <meta name="description" content="Bootstrap is a free and open-source CSS framework">

        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    </head>
    <body>
		<!-- This div is a row of columns, spaced evenly if there is no specified value -->
		 <!-- col-lg is Screen >= 992px: display like 4 columns in one line-->
		  <!-- padding is broken down into quarters, so p-2 is .5 rem -->
        <div class="row p-2">
            <div class="col-lg bg-primary text-white text-center">Primary</div>
            <div class="col-lg bg-success text-white text-center">Success</div>
            <div class="col-lg bg-danger text-white text-center">Danger</div>
            <div class="col-lg bg-warning text-white text-center">Warning</div>
        </div>

        <hr />

        <div class="row p-2">
            <div class="col-sm bg-primary text-white text-center">Primary</div>
            <div class="col-sm bg-success text-white text-center">Success</div>
            <div class="col-sm bg-danger text-white text-center">Danger</div>
            <div class="col-sm bg-warning text-white text-center">Warning</div>
        </div>

        <hr />
		<!-- just breaking down the sizes, tell it how many units and then break down sections -->
        <div class="row p-2">
            <div class="col-12 col-lg-2 bg-primary text-white text-center">Primary</div>
            <div class="col-12 col-lg-4 bg-success text-white text-center">Success</div>
            <div class="col-12 col-lg-6 bg-danger text-white text-center">Danger</div>
        </div>

        <hr />

        <div class="row p-2">
            <div class="order-xl-1 order-lg-2 text-white text-center bg-primary">Primary<div>
            <div class="order-xl-2 order-lg-3 text-white text-center bg-success">Success</div>
            <div class="order-xl-3 order-lg-4 text-white text-center bg-danger">Danger</div>
            <div class="order-xl-4 order-lg-1 text-white text-center bg-warning">Warning</div>
        </div>

        <hr/>

        <div class="row p-2">
            <div>Primary</div>
            <div>Success</div>
        </div>

        <hr/>

        <div>
            <div>Primary</div>
            <div>Success</div>
            <div>Danger</div>
        </div>
    </body>
</html>
